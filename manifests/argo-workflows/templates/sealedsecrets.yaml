# SEAL BEFORE DEPLOYING
#
# This SealedSecret provides credentials to the WorkflowTemplate pods:
#   GITOPS_TOKEN  — GitHub Personal Access Token with "repo" scope.
#                   Used by the deploy-staging and promote steps to clone
#                   and push to Yevgenio/plants-cluster.
#                   Create at: https://github.com/settings/tokens/new
#                   Scope required: repo (full control of private repositories)
#                   Note: this is the same token as GITOPS_TOKEN in GitHub
#                   Actions secrets — you can reuse the same PAT.
#
# How to seal:
#
#   kubectl create secret generic argo-secrets \
#     --namespace argo \
#     --from-literal=GITOPS_TOKEN='ghp_...' \
#     --dry-run=client -o yaml > /tmp/argo-secrets.yaml
#
#   kubeseal --controller-namespace sealed-secrets \
#            --controller-name sealed-secrets-controller \
#            --kubeconfig ~/.kube/oracle-config \
#            --format yaml \
#            < /tmp/argo-secrets.yaml \
#            > manifests/argo-workflows/templates/sealedsecrets.yaml
#
#   rm /tmp/argo-secrets.yaml
#
# Separately, the registry-push-creds secret (type: kubernetes.io/dockerconfigjson)
# must also exist in the argo namespace. It is used by the build (Kaniko) and
# push (crane) steps to authenticate against registry.boukingolts.dev.
#
# How to create registry-push-creds:
#
#   kubectl create secret docker-registry registry-push-creds \
#     --namespace argo \
#     --docker-server=registry.boukingolts.dev \
#     --docker-username=<registry-user> \
#     --docker-password=<registry-password> \
#     --dry-run=client -o yaml > /tmp/registry-push-creds.yaml
#
#   kubeseal --controller-namespace sealed-secrets \
#            --controller-name sealed-secrets-controller \
#            --kubeconfig ~/.kube/oracle-config \
#            --format yaml \
#            < /tmp/registry-push-creds.yaml \
#            >> manifests/argo-workflows/templates/sealedsecrets.yaml
#
#   rm /tmp/registry-push-creds.yaml
#
# Both sealed secrets are kept in this single file separated by ---
# After sealing, this file will contain two SealedSecret documents.

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argo-secrets
  namespace: argo
spec:
  encryptedData:
    GITOPS_TOKEN: SEAL_ME
  template:
    metadata:
      name: argo-secrets
      namespace: argo
    type: Opaque

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: registry-push-creds
  namespace: argo
spec:
  encryptedData:
    .dockerconfigjson: SEAL_ME
  template:
    metadata:
      name: registry-push-creds
      namespace: argo
    type: kubernetes.io/dockerconfigjson
