---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argo-secrets
  namespace: argo
spec:
  encryptedData:
    GITOPS_TOKEN: 
    WEBHOOK_SECRET: 
  template:
    metadata:
      name: argo-secrets
      namespace: argo
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: registry-push-creds
  namespace: argo
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: registry-push-creds
      namespace: argo
    type: kubernetes.io/dockerconfigjson
