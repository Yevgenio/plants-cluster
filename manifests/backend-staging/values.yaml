  # Updated automatically by Argo Workflows on each push to dev
  tag: "0e9936e"
  pullPolicy: Always

registry:
  enabled: true
  url: "registry.boukingolts.dev"

service:
  type: ClusterIP
  port: 5000

ingress:
  host: staging.api.boukingolts.dev

env:
