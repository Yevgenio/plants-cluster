  S3_ENDPOINT_URL: "https://axmemlyrscvh.compat.objectstorage.il-jerusalem-1.oraclecloud.com"
  S3_BUCKET: "images"
  S3_REGION: "il-jerusalem-1"

resources:
  requests:
    cpu: 10m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
