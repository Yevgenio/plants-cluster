replicaCount: 2

image:
  repository: ghcr.io/yevgenio/plants-backend
  # Updated automatically by GitHub Actions on each push to main
  tag: "24ebecf"
  pullPolicy: Always

# Set enabled: true and fill credentials if the GHCR package is private.
registry:
  enabled: false
  url: "ghcr.io"
  username: ""
  token: ""

service:
  type: ClusterIP
  port: 5000

ingress:
  host: api.boukingolts.dev

env:
  BASE_URL: "https://boukingolts.dev"
  API_URL: "https://api.boukingolts.dev"
  AWS_ENDPOINT_URL: "https://axftwemw5l5c.compat.objectstorage.il-jerusalem-1.oraclecloud.com"
  S3_BUCKET: "gallery"  # TODO: replace with a dedicated plants bucket
  AWS_REGION: "il-jerusalem-1"

resources:
  requests:
    cpu: 10m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
