---
# TODO: replace JWT_SECRET value before cluster goes live.
# Seal with:
#   kubectl get secret backend-secret -n plants-backend -o jsonpath='{.data.JWT_SECRET}' \
#     | base64 -d \
#     | kubeseal --raw --namespace plants --name frontend-secret \
#         --controller-namespace sealed-secrets \
#         --controller-name sealed-secrets-controller \
#         --from-file /dev/stdin
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: frontend-secret
  namespace: plants
spec:
  encryptedData:
    JWT_SECRET: 
  template:
    metadata:
      name: frontend-secret
      namespace: plants
    type: Opaque
