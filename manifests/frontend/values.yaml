replicaCount: 1

image:
  repository: ghcr.io/yevgenio/plants-frontend
  # Updated automatically by GitHub Actions on each push to main
  tag: "1b3c996"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3000

ingress:
  host: boukingolts.dev

env:
  # Server-side only — not baked into the image, overrides NEXT_PUBLIC_API_URL for SSR
  apiUrl: http://backend:5000

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
