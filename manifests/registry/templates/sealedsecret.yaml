# SEAL BEFORE DEPLOYING
#
# This file must be populated with kubeseal output before ArgoCD will apply it.
# The SealedSecret controller will fail to decrypt placeholder values and will
# not create the underlying Secret — so leaving placeholders here is safe but
# the registry will not start until you seal real values.
#
# How to seal (run from the plants/cluster directory):
#
#   1. Generate an htpasswd entry (bcrypt, cost factor 10):
#      htpasswd -Bbn <username> <password>
#      e.g.: htpasswd -Bbn argo secret123
#      Copy the output line (e.g. "argo:$2y$10$...") — that is the htpasswd value.
#
#   2. Generate a random HTTP secret (any random string, e.g.):
#      openssl rand -hex 32
#
#   3. Create a plain Secret manifest (do NOT commit this file):
#      kubectl create secret generic registry-secret \
#        --namespace registry \
#        --from-literal=AWS_ACCESS_KEY_ID='<same key as backend>' \
#        --from-literal=AWS_SECRET_ACCESS_KEY='<same secret as backend>' \
#        --from-literal=htpasswd='argo:$2y$10$<hash>' \
#        --from-literal=REGISTRY_HTTP_SECRET='<random hex>' \
#        --dry-run=client -o yaml > /tmp/registry-secret.yaml
#
#   4. Seal it:
#      kubeseal --controller-namespace sealed-secrets \
#               --controller-name sealed-secrets-controller \
#               --kubeconfig ~/.kube/oracle-config \
#               --format yaml \
#               < /tmp/registry-secret.yaml \
#               > manifests/registry/templates/sealedsecret.yaml
#
#   5. Commit the sealed file. Delete /tmp/registry-secret.yaml.
#
# Note: SealedSecrets are namespace-scoped. The same OCI credentials sealed
# for the "plants" namespace CANNOT be reused here — you must re-seal them
# for the "registry" namespace. The underlying key material is identical;
# only the sealing scope differs.
#
# The htpasswd credentials you choose here are what Kaniko and crane will use
# when pushing images, and what k3s will use when pulling them. Store them in
# your password manager alongside the other cluster secrets.

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: registry-secret
  namespace: registry
spec:
  encryptedData:
    AWS_ACCESS_KEY_ID: SEAL_ME
    AWS_SECRET_ACCESS_KEY: SEAL_ME
    htpasswd: SEAL_ME
    REGISTRY_HTTP_SECRET: SEAL_ME
  template:
    metadata:
      name: registry-secret
      namespace: registry
    type: Opaque
